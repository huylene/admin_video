<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu — Video Admin Manager</title>
  
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i data-lucide="shield-check"></i>
        </div>
        <h2 class="auth-title">Đặt lại mật khẩu</h2>
        <p class="auth-subtitle">Nhập mật khẩu mới cho tài khoản của bạn</p>
      </div>

      <div id="auth-alert" style="display: none; padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 16px;"></div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label required" for="new-password">Mật khẩu mới</label>
          <input type="password" id="new-password" class="form-input" placeholder="Tối thiểu 6 ký tự" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label required" for="confirm-password">Xác nhận mật khẩu mới</label>
          <input type="password" id="confirm-password" class="form-input" placeholder="Nhập lại mật khẩu mới" minlength="6" required autocomplete="new-password">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-2);">
          <span id="btn-text">Cập nhật mật khẩu</span>
          <span id="btn-spinner" class="spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="auth-footer">
        Nhớ mật khẩu? <a href="login.html" class="auth-link">Đăng nhập</a>
      </div>
    </div>
  </div>

  <script src="assets/js/reset-password.js"></script>
</body>
</html>
