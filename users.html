<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Người dùng — Video Admin Manager</title>

  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guards.js"></script>
  <script src="assets/js/api.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar"></aside>

    <div class="app-main">
      <header class="app-topbar"></header>

      <main class="app-content">
        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h2 style="font-size: var(--font-size-2xl); font-weight: 700; color: var(--text-main);">Quản lý Người dùng</h2>
            <p style="font-size: var(--font-size-sm); color: var(--text-muted); margin-top: 4px;">Danh sách tài khoản hệ thống và phân quyền vai trò (Chỉ dành cho ADMIN)</p>
          </div>
        </div>

        <!-- Filter Toolbar -->
        <div class="card" style="margin-bottom: var(--space-6); padding: var(--space-4);">
          <div class="toolbar-wrap">
            <div class="toolbar-search">
              <i data-lucide="search" style="width: 18px; height: 18px; color: var(--text-muted);"></i>
              <input type="text" id="user-search-input" class="form-input" placeholder="Tìm theo username hoặc email...">
            </div>

            <div class="toolbar-filters">
              <select id="user-role-filter" class="form-select" style="width: auto; min-width: 150px;">
                <option value="">Tất cả vai trò</option>
                <option value="ADMIN">ADMIN (Quản trị)</option>
                <option value="USER">USER (Thành viên)</option>
              </select>

              <button class="btn btn-secondary" id="reset-user-filter-btn">
                <i data-lucide="rotate-ccw"></i>
                <span>Đặt lại</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Users Table Card -->
        <div class="card">
          <div class="table-container" style="border: none;">
            <table class="table">
              <thead>
                <tr>
                  <th>Người dùng</th>
                  <th>Email</th>
                  <th>Vai trò</th>
                  <th>Trạng thái</th>
                  <th>Ngày đăng ký</th>
                  <th style="width: 130px; text-align: right;">Phân quyền</th>
                </tr>
              </thead>
              <tbody id="users-tbody">
                <tr>
                  <td colspan="6" style="text-align: center; padding: var(--space-8); color: var(--text-muted);">
                    <div class="spinner spinner-dark" style="margin-bottom: 8px;"></div>
                    <div>Đang nạp danh sách người dùng...</div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Empty State -->
          <div id="users-empty-state" class="empty-state" style="display: none;">
            <i data-lucide="users-round" class="empty-icon"></i>
            <h3 class="empty-title">Không tìm thấy người dùng nào</h3>
            <p class="empty-text">Thử tìm kiếm với từ khóa khác hoặc bỏ bộ lọc hiện tại.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/users.js"></script>
</body>
</html>
