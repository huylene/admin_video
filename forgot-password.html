<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu — Video Admin Manager</title>
  
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/guards.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i data-lucide="key-round"></i>
        </div>
        <h2 class="auth-title">Khôi phục mật khẩu</h2>
        <p class="auth-subtitle">Nhập email đã đăng ký để nhận liên kết đặt lại mật khẩu</p>
      </div>

      <div id="auth-alert" style="display: none; padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 16px;"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label required" for="email">Địa chỉ Email</label>
          <input type="email" id="email" class="form-input" placeholder="admin@example.com" required autocomplete="email">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-2);">
          <span id="btn-text">Gửi liên kết khôi phục</span>
          <span id="btn-spinner" class="spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="auth-footer">
        Quay lại <a href="login.html" class="auth-link">Đăng nhập</a>
      </div>
    </div>
  </div>

  <script src="assets/js/forgot-password.js"></script>
</body>
</html>
